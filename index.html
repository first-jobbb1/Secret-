<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>Секретное письмо</title>

  <style>
    :root {
      --paper: #f7f1df;
      --cream: #dfcda9;
      --cream-dark: #bda47e;
      --ink: #26384f;
      --gold: #a98a50;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(72, 103, 139, .16), transparent 24%),
        radial-gradient(ellipse at center, #102541 0%, #09182d 48%, #050e1d 100%);
      -webkit-tap-highlight-color: transparent;
    }

    .scene {
      position: relative;
      width: min(360px, 88vw);
      height: 390px;
      cursor: pointer;
      perspective: 1200px;
      user-select: none;
      outline: none;
    }

    .scene:focus-visible .envelope {
      filter: drop-shadow(0 25px 25px #0009) drop-shadow(0 0 8px #d6bd86);
    }

    .envelope {
      position: absolute;
      left: 0;
      bottom: 35px;
      width: 100%;
      height: 210px;
      isolation: isolate;
      transform-style: preserve-3d;
      filter: drop-shadow(0 24px 22px rgba(0, 0, 0, .58));
      transition: transform .35s ease, filter .35s ease;
    }

    .scene:not(.open):hover .envelope {
      transform: translateY(-5px) rotateX(1deg);
    }

    .back {
      position: absolute;
      inset: 0;
      z-index: 1;
      border: 1px solid rgba(91, 69, 43, .25);
      border-radius: 4px;
      background:
        linear-gradient(100deg, transparent 0 47%, rgba(255,255,255,.14) 49%, transparent 51%),
        linear-gradient(145deg, #eadbbf, #cdb891 58%, #b69d76);
      box-shadow: inset 0 1px 1px #fff8, inset 0 -7px 16px rgba(95, 69, 38, .12);
    }

    .paper-window {
      position: absolute;
      left: 7%;
      right: 7%;
      bottom: 0;
      height: 210px;
      z-index: 2;
      overflow: hidden;
      border-radius: 2px 2px 4px 4px;
    }

    .paper {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 285px;
      padding: 22px 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(90, 70, 45, .035) 0 1px, transparent 1px 5px),
        linear-gradient(105deg, #fbf7ea, var(--paper) 65%, #e5dcc6);
      border: 1px solid #d1c6ae;
      box-shadow: 0 4px 13px rgba(48, 37, 23, .22);
      transform: translateY(0);
      transition: transform 1.05s cubic-bezier(.22, .72, .19, 1);
    }

    .paper::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(169, 138, 80, .25);
      pointer-events: none;
    }

    .paper h1 {
      margin: 0;
      position: relative;
      z-index: 1;
      font: 600 30px Georgia, serif;
      letter-spacing: 7px;
      text-shadow: 0 1px #fff;
    }

    .wheel {
      position: relative;
      z-index: 1;
      width: 132px;
      height: 132px;
      flex: 0 0 auto;
      border: 6px solid #ad9057;
      border-radius: 50%;
      background:
        radial-gradient(circle, transparent 0 53%, rgba(255,255,255,.12) 54% 55%, transparent 56%),
        conic-gradient(
          #9d344b 0deg 45deg,
          #e5c47c 45deg 90deg,
          #344c6d 90deg 135deg,
          #9d344b 135deg 180deg,
          #e5c47c 180deg 225deg,
          #344c6d 225deg 270deg,
          #9d344b 270deg 315deg,
          #e5c47c 315deg 360deg
        );
      box-shadow:
        inset 0 0 0 2px #f1dfae,
        inset 0 0 13px rgba(40, 28, 14, .35),
        0 5px 9px rgba(0, 0, 0, .2);
    }

    .wheel::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 4px solid #ad9057;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fffaf0, #dcd1b7 55%, #b8a98a);
      box-shadow: 0 2px 5px rgba(0,0,0,.25);
    }

    .pointer {
      position: absolute;
      z-index: 3;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 18px solid #a98a50;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,.25));
    }

    .side-left, .side-right, .front {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .side-left {
      z-index: 3;
      background:
        linear-gradient(135deg, rgba(255,255,255,.28), transparent 35%),
        linear-gradient(135deg, #eadcbf, #bea780);
      clip-path: polygon(0 0, 50% 58%, 0 100%);
      filter: drop-shadow(1px 0 1px rgba(91,69,43,.12));
    }

    .side-right {
      z-index: 3;
      background:
        linear-gradient(225deg, rgba(255,255,255,.22), transparent 35%),
        linear-gradient(225deg, #dfcbaa, #b59d78);
      clip-path: polygon(100% 0, 50% 58%, 100% 100%);
      filter: drop-shadow(-1px 0 1px rgba(91,69,43,.12));
    }

    .front {
      z-index: 4;
      background:
        linear-gradient(25deg, transparent 49.6%, rgba(92,72,44,.10) 50%, transparent 50.4%),
        linear-gradient(155deg, transparent 49.6%, rgba(92,72,44,.10) 50%, transparent 50.4%),
        linear-gradient(145deg, #e3d1ad 0%, #cdb58c 58%, #baa27e 100%);
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
      box-shadow: inset 0 -10px 18px rgba(91,69,43,.10);
    }

    .front::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16%;
      background: linear-gradient(180deg, transparent, rgba(91,69,43,.09));
      clip-path: polygon(0 0, 50% 38%, 100% 0, 100% 100%, 0 100%);
    }

    .flap {
      position: absolute;
      z-index: 5;
      top: 0;
      left: 0;
      width: 100%;
      height: 122px;
      transform-origin: top center;
      transform-style: preserve-3d;
      transition: transform .75s cubic-bezier(.45, .05, .25, 1), z-index 0s .38s;
      background:
        linear-gradient(145deg, rgba(255,255,255,.22), transparent 38%),
        linear-gradient(180deg, #eadbbd, #cbb78f);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      backface-visibility: hidden;
      filter: drop-shadow(0 4px 2px rgba(71,52,30,.12));
    }

    .seal {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 106px;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border: 2px solid #721f30;
      border-radius: 48% 52% 47% 53%;
      background:
        radial-gradient(circle at 38% 32%, #d05d67 0 8%, transparent 9%),
        radial-gradient(circle at 52% 55%, #92263a 0 34%, #77182a 68%, #5d1120 100%);
      box-shadow:
        inset 3px 3px 5px rgba(255, 160, 160, .28),
        inset -4px -5px 7px rgba(40, 0, 10, .35),
        0 5px 8px rgba(0,0,0,.35);
      transition: opacity .25s ease, transform .35s ease;
    }

    .seal::before {
      content: "S";
      position: absolute;
      inset: 8px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(245, 164, 164, .55);
      border-radius: 50%;
      color: #e5a0a2;
      font: italic 700 22px Georgia, serif;
      text-shadow: 0 1px #57101d;
    }

    .scene.open .paper-window { overflow: visible; }

    .scene.open .paper {
      transform: translateY(-155px);
      transition-delay: .27s;
    }

    .scene.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .scene.open .seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.72) rotate(12deg);
    }

    @media (prefers-reduced-motion: reduce) {
      .paper, .flap, .seal, .envelope { transition-duration: .01ms; }
    }
  </style>
</head>

<body>
  <main
    class="scene"
    id="scene"
    role="button"
    tabindex="0"
    aria-label="Открыть конверт"
    aria-expanded="false"
  >
    <div class="envelope">
      <div class="back"></div>

      <div class="paper-window">
        <div class="paper">
          <h1>СКОРО</h1>
          <div class="wheel" aria-label="Колесо">
            <span class="pointer"></span>
          </div>
        </div>
      </div>

      <div class="side-left"></div>
      <div class="side-right"></div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal" aria-hidden="true"></div>
    </div>
  </main>

  <script>
    const scene = document.getElementById("scene");

    function toggleEnvelope() {
      const isOpen = scene.classList.toggle("open");
      scene.setAttribute("aria-expanded", String(isOpen));
      scene.setAttribute(
        "aria-label",
        isOpen ? "Закрыть конверт" : "Открыть конверт"
      );
    }

    scene.addEventListener("click", toggleEnvelope);

    scene.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleEnvelope();
      }
    });
  </script>
</body>
</html>
